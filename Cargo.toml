[package]
name = "wigwag"
version = "0.1.0"
edition = "2024"
description = "A small Signal daemon in Rust that speaks signal-cli's HTTP JSON-RPC API"
license = "AGPL-3.0-only"
repository = "https://github.com/hhh42/wigwag"
readme = "README.md"
keywords = ["signal", "messenger", "signal-cli", "json-rpc", "bot"]
categories = ["command-line-utilities", "network-programming"]
publish = false

[dependencies]
presage = { git = "https://github.com/whisperfish/presage", rev = "4b81740610c301cbd54d95f4dbd4cadd692af95e" }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "4b81740610c301cbd54d95f4dbd4cadd692af95e" }

anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
futures = "0.3"
hex = "0.4"
libc = "0.2"
mime_guess = "2.0"
qr2term = "0.3"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
shlex = "1.3"
tokio = { version = "1.48", features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time", "fs", "net", "io-std", "io-util", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Unoptimized ML-KEM can overflow the stack decrypting PQXDH prekey messages (as in presage).
[profile.dev.package.libcrux-ml-kem]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# presage-store-sqlite needs whisperfish's SQLCipher-enabled libsqlite3-sys.
[patch.crates-io]
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }
