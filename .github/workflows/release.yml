name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # publish the release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Ubuntu 22.04's protoc (3.12) is too old for libsignal's protos; 22.04 itself
      # stays for its older glibc, so the binaries run on more systems.
      - name: protoc
        env:
          PROTOC_VERSION: "29.3"
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install protobuf; exit; fi
          arch=$(uname -m); [ "$arch" = aarch64 ] && arch=aarch_64
          curl -sSfLo /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-${arch}.zip"
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          protoc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release --locked
      - name: Package
        run: |
          name=wigwag-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp target/release/wigwag README.md LICENSE CHANGELOG.md "$name/"
          cp -R contrib skills "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      # Verify with: gh attestation verify wigwag-….tar.gz --repo hhh42/wigwag
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: wigwag-*.tar.gz
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: wigwag-*.tar.gz*
          generate_release_notes: true
