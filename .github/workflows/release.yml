name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Ubuntu 22.04's protoc (3.12) is too old for libsignal's protos; 22.04 itself
      # stays for its older glibc, so the binaries run on more systems.
      - name: protoc
        env:
          PROTOC_VERSION: "29.3"
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install protobuf; exit; fi
          arch=$(uname -m); [ "$arch" = aarch64 ] && arch=aarch_64
          curl -sSfLo /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-${arch}.zip"
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          protoc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        run: |
          name=wigwag-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp target/release/wigwag README.md LICENSE CHANGELOG.md "$name/"
          cp -R contrib skills "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: wigwag-*.tar.gz*
          generate_release_notes: true
